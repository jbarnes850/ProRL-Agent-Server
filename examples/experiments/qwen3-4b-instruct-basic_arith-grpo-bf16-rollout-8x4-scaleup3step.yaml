# Phase 4 cell 6: scale-up confirmation. Winning config from cells 1-5 (bf16
# rollout beat fp8 on both total_step_time_s and weight_sync_s; grpo vs cispo
# showed no throughput difference so grpo stands as the primary baseline;
# gpu_memory_utilization=0.5 is the safest point in the proven-safe [0.35,
# 0.5] range; both weight-sync toggles showed no effect at single-step so
# defaults stand), rerun at max_steps=3 to report a sustained, not just
# peak, number and to give recompute_kv_cache_after_weight_updates a real
# multi-step chance to matter (step 2+ has a prior weight version to
# invalidate, unlike cell 5b's single step).
#
# Validate (no GPU) inside the image before launching:
#   python scripts/experiment/validate_against_nemo_loader.py \
#     examples/experiments/qwen3-4b-instruct-basic_arith-grpo-bf16-rollout-8x4-scaleup3step.yaml
