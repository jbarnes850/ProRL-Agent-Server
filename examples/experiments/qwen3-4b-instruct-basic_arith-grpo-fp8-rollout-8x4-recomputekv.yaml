# Phase 4 cell 5b: async_grpo.recompute_kv_cache_after_weight_updates=true,
# else identical to the passing FP8 GRPO baseline. Default is false; this
# isolates its effect on weight_sync_s/weight_sync_pct.
#
# Validate (no GPU) inside the image before launching:
#   python scripts/experiment/validate_against_nemo_loader.py \
#     examples/experiments/qwen3-4b-instruct-basic_arith-grpo-fp8-rollout-8x4-recomputekv.yaml
id: qwen3-4b-instruct-basic_arith-grpo-fp8-rollout-8x4-recomputekv
parent: qwen3-4b-instruct-basic_arith-grpo-fp8-rollout-8x4

model:
  name: Qwen/Qwen3-4B-Instruct-2507
  snapshot: cdbee75f17c01a7cc42f958dc650907174af0554
  nemo_path: /host-hf/hub/models--Qwen--Qwen3-4B-Instruct-2507/snapshots/cdbee75f17c01a7cc42f958dc650907174af0554
  max_total_sequence_length: 4096

dataset:
  family: nemo_gym
  source: nvidia/Nemotron-RL-ReasoningGym-v1
  subset: basic_arithmetic
  local_jsonl: examples/datasets/basic_arithmetic_curated.jsonl

verifier:
  type: exact_answer
  execution: single_turn_chat

algorithm:
  name: grpo

async_grpo:
  lag: 1
  recompute_kv_cache: true

rollout:
  prompts_per_step: 8
  generations_per_prompt: 4
  max_steps: 1
  temperature: 1.0
  top_p: 1.0

precision:
  train: bfloat16
  rollout_backend: vllm
  rollout: fp8
  kv_cache_dtype: auto

vllm_runtime:
  gpu_memory_utilization: 0.5
  enforce_eager: false
  max_num_batched_tokens: 16384
  max_num_seqs: 256
