# Qwen3-4B-Instruct-2507 GRPO smoke with NeMo BF16 training and FP8 vLLM rollout.
# Keeps KV cache on auto; FP8 KV cache is a separate backend spike.
#
# Validate (no GPU) inside the image before launching:
#   python scripts/experiment/validate_against_nemo_loader.py \
#     examples/experiments/qwen3-4b-instruct-basic_arith-grpo-fp8-rollout-8x4.yaml
id: qwen3-4b-instruct-basic_arith-grpo-fp8-rollout-8x4
parent: qwen3-1p7b-basic_arith-grpo-8x4

model:
  name: Qwen/Qwen3-4B-Instruct-2507
  snapshot: cdbee75f17c01a7cc42f958dc650907174af0554
  nemo_path: /host-hf/hub/models--Qwen--Qwen3-4B-Instruct-2507/snapshots/cdbee75f17c01a7cc42f958dc650907174af0554
  max_total_sequence_length: 4096

dataset:
  family: nemo_gym
  source: nvidia/Nemotron-RL-ReasoningGym-v1
  subset: basic_arithmetic
  local_jsonl: examples/datasets/basic_arithmetic_curated.jsonl

verifier:
  type: exact_answer
  execution: single_turn_chat

algorithm:
  name: grpo

async_grpo:
  lag: 1

rollout:
  prompts_per_step: 8
  generations_per_prompt: 4
  max_steps: 1
  temperature: 1.0
  top_p: 1.0

precision:
  train: bfloat16
  rollout_backend: vllm
  rollout: fp8
  kv_cache_dtype: auto

# gpu_memory_utilization: DGX Spark's GB10 uses unified memory (CPU+GPU share
# one ~119GB pool per host). 0.9 reserved ~90% of that shared pool for vLLM
# alone and Ray OOM-killed the worker (node hit 115.89/121.69GB, 95.2%) with
# Ray/Polar/host overhead sharing the same box. 0.5 leaves headroom; the
# concurrency sweep (Phase 4 cell 4) explores this axis properly.
vllm_runtime:
  gpu_memory_utilization: 0.5
  enforce_eager: false
  max_num_batched_tokens: 16384
  max_num_seqs: 256
