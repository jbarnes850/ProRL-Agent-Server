# Stage 4 infrastructure parity cell. This does not test learning quality; it
# proves that the FP8 rollout-time nucleus is replayed by the BF16 LoRA trainer.
id: qwen3p5-9b-reasoning_gym-cispo-fp8-top-p095-replay-smoke

model:
  name: Qwen/Qwen3.5-9B
  nemo_path: /models/Qwen/Qwen3.5-9B
  max_total_sequence_length: 4096

dataset:
  family: reasoning_gym

verifier:
  type: exact_answer
  execution: single_turn_chat

algorithm:
  name: cispo

async_grpo:
  lag: 1
  in_flight_weight_updates: true
  recompute_kv_cache: true

rollout:
  prompts_per_step: 1
  generations_per_prompt: 8
  max_steps: 1
  temperature: 1.0
  top_p: 0.95
  sampling_support_replay: true
  sampling_support_size: 256

precision:
  train: bfloat16
  rollout_backend: vllm
  rollout: fp8
  kv_cache_dtype: auto

trainer:
  activation_checkpointing: true
  freeze_vision_tower: true
  freeze_audio_tower: true
  lora:
    enabled: true
    dim: 32
    alpha: 32
    target_modules: ["model.language_model.*proj*"]
    exclude_modules: []
    match_all_linear: false
    dropout: 0.0
    dropout_position: post
    lora_A_init: xavier
    use_triton: true

vllm_runtime:
  gpu_memory_utilization: 0.35
  enforce_eager: false
  max_model_len: 131072
  max_num_batched_tokens: 4096
  max_num_seqs: 8
  enable_prefix_caching: true
  enable_chunked_prefill: true
  mamba_cache_mode: align
  language_model_only: true
  quantization_ignored_layer_kws:
    - linear_attn.in_proj_a
    - linear_attn.in_proj_b
